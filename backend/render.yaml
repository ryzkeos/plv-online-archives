services:
  - type: web
    name: plv-online-archives-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python3 scripts/seed.py
    startCommand: gunicorn --worker-class gthread --threads 4 -w 1 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: FRONTEND_URL
        value: https://plvonlinearchives.vercel.app 
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false   # https://[project-ref].supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false   # service_role key from Supabase API settings
      - key: SUPABASE_STORAGE_BUCKET
        value: plv-archives
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
